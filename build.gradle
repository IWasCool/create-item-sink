plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = "item_sink-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.architectury.dev' }
}

neoForge {
    version = project.neo_version
    mods { item_sink { sourceSet sourceSets.main } }
    runs {
        configureEach {
            gameDirectory = layout.buildDirectory.dir("runs/${name}")
            systemProperty 'log4j2.configurationFile', file("build/moddev/${name}Log4j2.xml").toURI().toString()
        }
        client { client(); loadedMods = [mods.item_sink] }
        server { server(); loadedMods = [mods.item_sink]; programArgument '--nogui' }
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**'
}
processResources {
    def metadata = providers.provider {
        project.properties.findAll { key, value -> value instanceof String || value instanceof Number || value instanceof Boolean }
    }
    inputs.property 'metadata', metadata
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand metadata.get() }
}

dependencies {
    implementation 'maven.modrinth:create:UjX6dr61'
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.70.0.469'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.70.0.469'
    runtimeOnly 'maven.modrinth:numismatics:kVi3TESX'
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly('mezz.jei:jei-1.21.1-neoforge:19.70.0.469') { transitive = false }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from(files('LICENSE', 'LICENSE.txt', 'TEMPLATE_LICENSE.txt')) { into 'META-INF' }
    from('LICENSES') { into 'META-INF/licenses' }
}

apply from: 'languages.gradle'

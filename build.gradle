plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

group = 'com.ourcreation.itemsink'
version = mod_version
base.archivesName = 'create_item_sink'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    mods {
        item_sink { sourceSet sourceSets.main }
        item_sink_tests { sourceSet sourceSets.gametest }
    }
    runs {
        client {
            client()
            loadedMods = [mods.item_sink]
        }
        server {
            server()
            loadedMods = [mods.item_sink]
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            loadedMods = [mods.item_sink, mods.item_sink_tests]
            gameDirectory = project.layout.projectDirectory.dir(
                    providers.gradleProperty('withoutNumismatics').isPresent() ? 'run-gametest-without-numismatics' : 'run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', 'item_sink_tests'
        }
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.gametest)

dependencies {
    // Create supplies Ponder at runtime; only its API is needed to compile our scenes.
    modCompileOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") {
        transitive = false
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    // Use Create's Ponder helpers for animated belts and funnels.
    modImplementation "maven.modrinth:create:${create_version}"
    if (!providers.gradleProperty('withoutNumismatics').isPresent()) {
        modRuntimeOnly "maven.modrinth:numismatics:${numismatics_version}"
    }
}

// All resources use Minecraft 1.20.1 paths and live inside this project.
def metadataProperties = [mod_version: mod_version]

tasks.named('processResources', ProcessResources) {
    inputs.properties metadataProperties
    exclude '**/*.bbmodel'
    filesMatching('META-INF/mods.toml') {
        expand metadataProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('TEMPLATE_LICENSE.txt')
}

idea.module.downloadSources = true

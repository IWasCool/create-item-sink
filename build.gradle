plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = 'create_item_sink'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main.resources {
        exclude '**/*.bbmodel', '**/.cache/**'
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    mods {
        item_sink { sourceSet sourceSets.main }
    }
    runs {
        configureEach {
            // Numismatics restores Log4j using a URI, including on Windows.
            systemProperty 'log4j2.configurationFile', file("build/moddev/${name}Log4j2.xml").toURI().toString()
        }
        client {
            client()
            loadedMods = [mods.item_sink]
        }
        server {
            server()
            loadedMods = [mods.item_sink]
            programArgument '--nogui'
        }
    }
}

dependencies {
    implementation "maven.modrinth:create:${create_version}"
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "maven.modrinth:numismatics:${numismatics_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range, neo_version: neo_version,
            loader_version_range: loader_version_range, mod_id: mod_id,
            mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from 'LICENSE'
    from 'TEMPLATE_LICENSE.txt'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

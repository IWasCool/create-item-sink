name: Build NeoForge

on: [push, pull_request]

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: bash ./gradlew build
      - name: Test with Numismatics
        run: bash ./gradlew runGameTestServer
      - name: Test without Numismatics
        run: bash ./gradlew runGameTestServer -PwithoutNumismatics
      - name: Check languages
        run: python tools/check_translations.py build/libs/create_item_sink-1.0.0.jar
      - name: Check catalogue
        run: python -m unittest discover -s tools -p test_item_values.py
      - uses: actions/upload-artifact@v4
        with:
          name: create_item_sink-neoforge-1.21.1-1.0.0
          path: build/libs/create_item_sink-1.0.0.jar

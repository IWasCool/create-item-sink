// Development-only full registry scan, isolated from player saves and configs.
// Prepare the jar inventory first with tools/scan_item_values.py.
gradle.beforeProject { p ->
  p.afterEvaluate {
    def scan = p.sourceSets.create('valuescan')
    scan.compileClasspath += p.sourceSets.main.output
    p.neoForge.addModdingDependenciesTo(scan)
    p.neoForge.mods.create('item_sink_value_scan') { sourceSet(scan) }
    p.neoForge.runs.create('valueScan') {
        server()
        gameDirectory = p.file('build/value-scan-run')
        programArgument '--nogui'
        systemProperty 'item_sink.scan.output', p.file('build/value-registry.json').absolutePath
        systemProperty 'item_sink.scan.orestoneValues', p.file('tools/orestone_values.json').absolutePath
        systemProperty 'item_sink.scan.validate', p.findProperty('validateValues') ?: 'false'
        jvmArgument '-Xmx6G'
    }
    p.configurations.localRuntime.dependencies.clear()
    p.dependencies.add('localRuntime', p.fileTree(dir: 'build/value-scan-mods', include: ['*.jar']))
  }
}
